<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 桌宠 - 设置</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>
<div id="app">
  <div id="header">
    <h1>🐾 AI 桌宠</h1>
    <span class="subtitle">桌面聊天精灵 · 设置</span>
  </div>

  <div id="content">
    <!-- 左侧：桌宠目录 + 显示 -->
    <div class="panel" id="panel-left">
      <div class="panel-title">📂 桌宠目录</div>
      <div class="panel-desc">当前使用的桌宠图片</div>
      <div id="preview-area">
        <img id="preview-img" src="" alt="预览">
        <div id="preview-empty">暂无图片</div>
      </div>
      <div class="hint">替换图片：直接覆盖 <code>resources/pet-default.png</code></div>

      <div class="panel-title" style="margin-top:16px">📏 桌宠大小</div>
      <div id="size-row">
        <input id="size-slider" type="range" min="60" max="160" value="100">
        <span id="size-val">100%</span>
      </div>

      <div class="panel-title" style="margin-top:16px">🔒 窗口锁定</div>
      <div class="panel-desc">解锁后可拖拽移动桌宠位置</div>
      <button id="btn-lock" class="toggle-btn active">🔒 已锁定</button>
    </div>

    <!-- 右侧：AI 设置 -->
    <div class="panel" id="panel-right">
      <div class="panel-title">🤖 AI 接口配置</div>
      <div class="panel-desc">连接 AI API 实现桌面聊天</div>

      <div class="row">
        <label>🔗 API 地址</label>
        <input id="ai-url" class="ai-inp" type="text" placeholder="https://api.openai.com/v1">
      </div>

      <div class="row">
        <label>🔑 API 密钥</label>
        <div class="key-row">
          <input id="ai-key" class="ai-inp" type="password" placeholder="sk-...">
          <button id="btn-toggle-key" class="btn-sm" title="显示/隐藏">👁️</button>
        </div>
      </div>

      <div class="row">
        <label>🧠 模型</label>
        <input id="ai-model" class="ai-inp" type="text" placeholder="gpt-4o-mini">
      </div>

      <div class="row">
        <label>💬 AI 人设</label>
        <textarea id="ai-prompt" class="ai-ta" rows="3" placeholder="你是一个可爱的桌面宠物精灵…"></textarea>
      </div>

      <div class="row" style="margin-top:4px">
        <button id="btn-save-ai" class="btn-primary">💾 保存</button>
        <span id="ai-status" class="status"></span>
      </div>
    </div>
  </div>

  <div id="footer">
    <span>拖动窗口边缘可调整大小</span>
    <button id="btn-quit" class="btn-quit">✕ 退出</button>
  </div>
</div>
<script src="settings.js"></script>
</body>
</html>
